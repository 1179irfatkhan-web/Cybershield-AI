{% extends 'base.html' %}{% block content %}<div class="container py-4"><h1>Review imported email</h1><p>Check the extracted details before analysis. You can edit anything that looks wrong.</p>{% if data.extraction_warnings %}<div class="alert alert-warning">{{ data.extraction_warnings|join:' ' }}</div>{% endif %}<form method="post" action="{% url 'email_scans:create' %}">{% csrf_token %}<input type="hidden" name="input_source" value="pdf_import"><div class="mb-3"><label class="form-label">Subject</label><input class="form-control" name="subject" value="{{ data.subject }}"></div><div class="mb-3"><label class="form-label">Sender name</label><input class="form-control" name="sender_name" value="{{ data.sender_name }}"></div><div class="mb-3"><label class="form-label">Email address that sent the message</label><input class="form-control" type="email" name="sender_email" value="{{ data.sender_email }}"></div><div class="mb-3"><label class="form-label">Where your reply would be sent</label><input class="form-control" type="email" name="reply_to" value="{{ data.reply_to }}"></div><div class="mb-3"><label class="form-label">Email message</label><textarea class="form-control" rows="12" name="email_body">{{ data.email_body }}</textarea></div><input type="hidden" name="body_type" value="plain_text"><textarea class="form-control" name="attachment_metadata" hidden>{{ data.attachment_metadata|join:', ' }}</textarea><button class="btn btn-primary">Analyze Email</button> <a class="btn btn-outline-secondary" href="{% url 'email_scans:import_pdf' %}">Upload another PDF</a></form></div>{% endblock %}
