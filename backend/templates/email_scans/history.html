{% extends "base.html" %}{% block title %}Email History{% endblock %}{% block content %}<div class="container py-5"><h1>Email scan history</h1><table class="table"><tr><th>Date</th><th>Status</th><th>Score</th></tr>{% for scan in scans %}<tr><td><a href="{% url 'email_scans:result' scan.id %}">{{ scan.created_at }}</a></td><td>{{ scan.status }}</td><td>{{ scan.safety_score|default:"—" }}</td></tr>{% empty %}<tr><td colspan="3">No email scans yet.</td></tr>{% endfor %}</table></div>{% endblock %}
