{% extends 'base.html' %}{% block content %}<div class="container py-5"><h1>Assessment History</h1>{% for assessment in assessments %}<div class="card mb-2"><div class="card-body"><a href="{% url 'security_assessments:result' assessment.id %}">{{ assessment.submitted_url }}</a><span class="badge text-bg-warning ms-2">{{ assessment.status }}</span><small class="text-secondary d-block">{{ assessment.created_at }}</small></div></div>{% empty %}<div class="alert alert-light border">You have not created any authorized security assessments yet.</div>{% endfor %}</div>{% endblock %}
